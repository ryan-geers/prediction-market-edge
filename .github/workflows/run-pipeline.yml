name: Run Pipeline

on:
  workflow_dispatch:
  schedule:
    # UTC-only (GitHub). Anchored to America/Chicago during daylight (CDT): 00:00 / 06:00 / 12:00 / 18:00 local.
    # In standard time (CST) the same UTC instants fall ~07:00 / 13:00 / 19:00 / ~01:00 local (one-hour shift).
    - cron: "0 5,11,17,23 * * *"

# Shared pipeline logic with local: `pme run` then report helpers; artifacts restore/persist state on ephemeral runners.
#
# State continuity hazard: cache keys are per-run (`pme-state-${{ github.run_id }}`) with
# restore-keys `pme-state-`. A total cache miss (or a poisoned empty DB restored as the
# newest prefix match) would let `pme consolidate-positions` / `Storage.__init__` create a
# fresh DuckDB, then `pme-db-latest` overwrite:true + cache/save would permanently wipe
# paper history. Guard + artifact recovery below prevent that.
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
      BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
      KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
      KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
      SAVE_RUN_ARTIFACTS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # restore-only: do NOT use actions/cache@v4 here — that action auto-saves on
      # primary-key miss at job end and would re-poison pme-state-* after an empty bootstrap.
      - name: Restore prior data
        uses: actions/cache/restore@v4
        with:
          path: |
            data/pme.duckdb
            data/reports
          key: pme-state-${{ github.run_id }}
          restore-keys: |
            pme-state-

      # Refuse to bootstrap an empty DuckDB on cache miss: Storage() creates schema-only
      # files, and the later overwrite of pme-db-latest would destroy recoverable history.
      - name: Ensure DuckDB history before mutating state
        id: db_guard
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_EMPTY: ${{ vars.PME_ALLOW_EMPTY_DB_BOOTSTRAP || '' }}
        run: |
          set -euo pipefail

          db_has_history() {
            if [ ! -f data/pme.duckdb ]; then
              return 1
            fi
            # Age is irrelevant here — any prior run_manifest row means history exists.
            pme check-state --max-run-age-days 36500
          }

          if db_has_history; then
            echo "has_history=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::warning::DuckDB missing or empty after cache restore — attempting pme-db-latest artifact recovery"

          # Drop a schema-only / poisoned file so we do not keep writing into it.
          rm -f data/pme.duckdb
          mkdir -p /tmp/pme-db-latest-restore
          if gh run download --name pme-db-latest --dir /tmp/pme-db-latest-restore --repo "${{ github.repository }}"; then
            if [ -f /tmp/pme-db-latest-restore/pme.duckdb ]; then
              mkdir -p data
              mv /tmp/pme-db-latest-restore/pme.duckdb data/pme.duckdb
            elif [ -f /tmp/pme-db-latest-restore/data/pme.duckdb ]; then
              mkdir -p data
              mv /tmp/pme-db-latest-restore/data/pme.duckdb data/pme.duckdb
            fi
          fi

          if db_has_history; then
            echo "Recovered DuckDB history from pme-db-latest artifact"
            echo "has_history=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${ALLOW_EMPTY}" = "true" ]; then
            echo "::warning::PME_ALLOW_EMPTY_DB_BOOTSTRAP=true — continuing with empty DuckDB bootstrap"
            echo "has_history=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error title=PME state missing::Cache miss/empty DuckDB and pme-db-latest recovery failed. Refusing to create a fresh DB (would overwrite pme-db-latest and poison pme-state-* cache). Set repo variable PME_ALLOW_EMPTY_DB_BOOTSTRAP=true only for intentional first-time bootstrap."
          echo "has_history=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Consolidate duplicate positions
        run: |
          pme consolidate-positions

      - name: Run pipeline
        run: |
          pme run --thesis economic_indicators

      - name: Generate weekly digest snapshot
        run: |
          pme weekly-digest --output data/reports/weekly_digest_latest.md

      - name: Paper trading report
        run: |
          pme paper-report --output data/reports/paper_trading_latest.md

      - name: Prune old run_report archives
        run: pme prune-reports --dir data/reports --keep 48

      - name: Verify DuckDB still has history before persisting
        id: db_persist_ok
        run: |
          set -euo pipefail
          if pme check-state --max-run-age-days 36500; then
            echo "persist=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Post-run DuckDB has empty run_manifest — refusing to save cache / overwrite pme-db-latest"
            echo "persist=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Save state to cache
        if: steps.db_persist_ok.outputs.persist == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            data/pme.duckdb
            data/reports
          key: pme-state-${{ github.run_id }}

      # Rolling DB snapshot — always reflects the most recent completed pipeline run.
      # Overwrites the previous copy so only one artifact slot is consumed.
      # Recovery: download this artifact and place pme.duckdb at data/pme.duckdb
      # before triggering the next pipeline run to restore accumulated history.
      - name: Upload rolling DB snapshot
        if: steps.db_persist_ok.outputs.persist == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pme-db-latest
          path: data/pme.duckdb
          if-no-files-found: warn
          overwrite: true
          retention-days: 90

      - name: Write run summary
        run: |
          {
            echo "## Prediction Market Edge Run"
            ls -la data/reports
            if [ -f data/reports/weekly_digest_latest.md ]; then
              head -n 40 data/reports/weekly_digest_latest.md
            fi
          } >> "$GITHUB_STEP_SUMMARY" 2>&1 || true

  audit:
    name: DB Audit
    runs-on: ubuntu-latest
    needs: run
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Restore DB from cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/pme.duckdb
            data/reports
          key: pme-state-${{ github.run_id }}
          restore-keys: |
            pme-state-

      - name: Run DB audit
        id: audit
        run: |
          mkdir -p data/reports
          python scripts/audit_db.py \
            --db data/pme.duckdb \
            --out data/reports/audit_latest.md \
            --json data/reports/audit_latest.json \
            --github-summary
          # Capture exit code but never let it fail the job — audit is
          # advisory only. Critical findings surface as a workflow warning
          # annotation in the step below.
          echo "audit_exit=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Annotate findings
        if: always()
        run: |
          EXIT="${{ steps.audit.outputs.audit_exit }}"
          if [ "$EXIT" = "2" ]; then
            echo "::warning title=PME Audit — CRITICAL::One or more CRITICAL findings detected. Download the pme-audit-report artifact or check the DB Audit step summary for details."
          elif [ "$EXIT" = "1" ]; then
            echo "::notice title=PME Audit — WARNING::One or more WARNING-level findings detected. See the DB Audit step summary."
          else
            echo "::notice title=PME Audit — PASS::All audit checks passed."
          fi

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: pme-audit-report
          path: |
            data/reports/audit_latest.md
            data/reports/audit_latest.json
          if-no-files-found: warn
          overwrite: true
          retention-days: 90
